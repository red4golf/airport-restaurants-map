name: Build GeoJSON

on:
  workflow_dispatch:
  schedule:
    # Every Sunday at 09:15 UTC (adjust as desired)
    - cron: "15 9 * * 0"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build GeoJSON
        run: python tools/build_geojson.py

      - name: Commit changes (if any)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/restaurants.geojson
          git diff --staged --quiet || git commit -m "Update restaurants.geojson"
          git push
